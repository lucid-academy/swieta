<style>
/* ═══════════════════════════════════════════════════════════════════
   INTRO — archiwum magnesów, 2018-2026

   Kamera stoi, przestrzeń płynie na nią. Każdy magnes to warstwa na
   własnej głębokości Z w jednym kontekście 3D, więc karty naprawdę
   mijają się i przenikają — nie udajemy tego kolejnością w DOM.

   Animujemy wyłącznie transform i opacity. Blur jest tylko statyczny
   (rasteryzowany raz), bo animowany blur to repaint co klatkę i koniec
   z 60 fps na telefonie.

   Dwie pułapki 3D, obchodzone celowo:
     · filter na elemencie spłaszcza go w kontekście preserve-3d,
       więc blur i cienie siedzą na <img>, nigdy na .karta
     · overflow: hidden robi to samo, więc kadrowanie jest na #intro,
       a preserve-3d dopiero na .scena w środku
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --ciemne:   #14100e;
  --ciemniej: #080605;
  --kremowe:  #f1e3c8;
  --perspektywa: 1200px;

  /* Mnożnik tempa — tylko na czas oceny rytmu, w docelowej stronie znika. */
  --tempo: 1;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--ciemniej);
  color: var(--kremowe);
  font-family: Georgia, 'Times New Roman', serif;
  -webkit-text-size-adjust: 100%;
}

/* ─────────── karta pod spodem ─────────── */
/* Intro jest nakładką: ta karta stoi pod nim od początku i sama się
   dogrywa, więc po wygaszeniu jest już gotowa. W docelowej stronie
   zastąpi ją mapa. */

#pod-spodem {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 1.1rem;
  text-align: center;
  padding: 2rem;
  background:
    radial-gradient(120% 90% at 50% 0%, #2b2119 0%, #14100e 55%, #080605 100%);
}
#pod-spodem h1 {
  margin: 0;
  font-size: clamp(1.35rem, 5.2vw, 2.1rem);
  font-weight: 400;
  line-height: 1.25;
  letter-spacing: .01em;
}
#pod-spodem .kiedy {
  margin: 0;
  font-size: clamp(.86rem, 3.2vw, 1.02rem);
  letter-spacing: .05em;
  color: rgba(241,227,200,.72);
}
#pod-spodem .guziki {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .6rem;
  margin-top: .6rem;
}
#pod-spodem a, #pod-spodem button {
  appearance: none;
  font: inherit;
  font-size: .95rem;
  letter-spacing: .03em;
  padding: .85rem 1.5rem;
  border-radius: 999px;
  cursor: pointer;
  text-decoration: none;
  min-height: 48px;
  display: inline-flex;
  align-items: center;
}
#pod-spodem .glowny {
  background: var(--kremowe);
  color: #16110d;
  border: 1px solid var(--kremowe);
}
#pod-spodem .glowny:hover { background: #fff6e6; }
#pod-spodem .drugi {
  background: transparent;
  color: var(--kremowe);
  border: 1px solid rgba(241,227,200,.42);
}
#pod-spodem .drugi:hover { background: rgba(241,227,200,.14); }
#pod-spodem a:focus-visible, #pod-spodem button:focus-visible {
  outline: 3px solid var(--kremowe); outline-offset: 3px;
}

/* ─────────── nakładka intra ─────────── */

#intro {
  position: fixed;
  inset: 0;
  overflow: hidden;               /* kadr — poza tym kontekstem 3D */
  background:
    radial-gradient(130% 100% at 50% 50%, #241b16 0%, #120e0c 48%, #060404 100%);
  transition: opacity .5s ease;
  z-index: 10;
  touch-action: manipulation;
}
#intro.znika { opacity: 0; pointer-events: none; }
#intro[hidden] { display: none; }

/* Delikatne pojaśnienie w chwili największego natłoku — jeden element,
   animowana sama opacity. */
#poswiata {
  position: absolute;
  inset: -10%;
  pointer-events: none;
  background: radial-gradient(50% 50% at 50% 50%, rgba(241,227,200,.14), transparent 70%);
  opacity: 0;
  animation: poswiata calc(13.4s * var(--tempo)) ease-in-out both;
  animation-play-state: paused;
}
@keyframes poswiata {
  0%, 20% { opacity: 0; }
  62%     { opacity: 1; }
  72%     { opacity: .35; }
  76%     { opacity: 0; }   /* oddech przed finałem — kadr ciemnieje */
  86%     { opacity: .5; }
  100%    { opacity: .32; }
}

/* ─────────── scena 3D ─────────── */

.scena {
  position: absolute;
  inset: 0;
  perspective: var(--perspektywa);
  perspective-origin: 50% 50%;
  transform-style: preserve-3d;
}

/* Karta trzyma wyłącznie transform i opacity, żeby została czystym
   liściem kontekstu 3D i mogła się sortować z resztą. */
.karta {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--w);
  animation-name: przelot;
  animation-duration: calc(var(--t) * var(--tempo) * 1s);
  animation-delay: calc(var(--d) * var(--tempo) * 1s);
  animation-timing-function: linear;   /* stała prędkość w przestrzeni =
                                          perspektywa sama robi przyspieszenie */
  animation-fill-mode: both;
  animation-play-state: paused;
  backface-visibility: hidden;
}
.karta img {
  display: block;
  width: 100%;
  height: auto;
}

/* Prostokąty dostają ciepły kant i cień — dziewięć różnych rąk zaczyna
   wyglądać jak dziewięć przedmiotów wyjętych z jednego pudełka. */
.karta.papier img {
  border: .45vmin solid rgba(246,238,222,.92);
  box-shadow: 0 2vmin 5.5vmin rgba(0,0,0,.62);
}

/* Sylwetki lecą bez cienia — drop-shadow w ruchu jest drogi. */
.karta.sylwetka img { box-shadow: none; border: 0; }

/* Drugi plan: węgiel z 2020. Blur statyczny, na <img>, nie na karcie. */
.karta.drugi-plan img {
  filter: blur(1.6px) brightness(.78) contrast(.92);
}

@keyframes przelot {
  0% {
    transform: translate3d(calc(-50% + var(--x0)), calc(-50% + var(--y0)), var(--z0))
               rotate(var(--r0)) rotateY(var(--ry));
    opacity: 0;
  }
  14%  { opacity: var(--jasnosc, 1); }
  55% {
    transform: translate3d(calc(-50% + var(--xm)), calc(-50% + var(--ym)), var(--zm))
               rotate(var(--rm)) rotateY(var(--ry));
  }
  84%  { opacity: var(--jasnosc, 1); }
  100% {
    transform: translate3d(calc(-50% + var(--x1)), calc(-50% + var(--y1)), var(--z1))
               rotate(var(--r1)) rotateY(var(--ry));
    opacity: 0;
  }
}

/* ─────────── tory lotu ───────────

   x/y to przesunięcia w PRZESTRZENI, nie na ekranie. Perspektywa sama
   je rozciąga w miarę zbliżania: karta z ustalonym x odpływa na bok tym
   szybciej, im bliżej kamery. Dlatego część kart wychodzi z głębi
   (2018, 2019, 2020, 2023, 2026), a część wpada z boku kadru już z
   bliska (2021, 2022, 2024, 2025) — inaczej wszystko rodziłoby się
   w jednym punkcie zbiegu.

   Skala na ekranie = 1200 / (1200 − z).
   z = −2800 → 0,30    z = −200 → 0,86    z = 0 → 1,00    z = +700 → 2,40   */

/* 2018 — z głębi, mija kamerę górą-prawo. 1,5 s całkiem sam w kadrze. */
.k2018 { --d: .45; --t: 3.40; --w: 84vmin; --ry: 16deg;
  --x0: -10vw; --y0:  6vh; --z0: -2800px; --r0: -8deg;
  --xm:   2vw; --ym:  0vh; --zm:  -150px; --rm: -2deg;
  --x1:  32vw; --y1:-16vh; --z1:   620px; --r1:  4deg; }

/* 2019 — lustrzanie: wylot dołem-lewo. Pierwsze skrzyżowanie torów. */
.k2019 { --d: 2.00; --t: 3.20; --w: 84vmin; --ry: -18deg;
  --x0:  11vw; --y0: -7vh; --z0: -2900px; --r0:  9deg;
  --xm:  -3vw; --ym:  0vh; --zm:  -190px; --rm:  2deg;
  --x1: -32vw; --y1: 17vh; --z1:   600px; --r1: -5deg; }

/* 2020 — węgiel. Nie zbliża się do kamery, przechodzi skosem po tle. */
.k2020 { --d: 3.40; --t: 2.30; --w: 70vmin; --ry: 0deg; --jasnosc: .5;
  --x0: -34vw; --y0:-24vh; --z0: -2900px; --r0:-12deg;
  --xm:  -2vw; --ym: -4vh; --zm: -2100px; --rm: -7deg;
  --x1:  30vw; --y1: 20vh; --z1: -1400px; --r1: -2deg; }

/* 2021 — wpada z lewej krawędzi, przecina kadr, wychodzi prawą. */
.k2021 { --d: 4.60; --t: 2.40; --w: 80vmin; --ry: 26deg;
  --x0:-140vw; --y0: 22vh; --z0: -1100px; --r0:  7deg;
  --xm: -12vw; --ym:  3vh; --zm:  -320px; --rm:  1deg;
  --x1:  32vw; --y1:-12vh; --z1:   620px; --r1: -6deg; }

/* 2022 — z prawej-góry, w przeciwną stronę niż 2021. Mijają się. */
.k2022 { --d: 5.65; --t: 2.00; --w: 80vmin; --ry: -24deg;
  --x0: 145vw; --y0:-26vh; --z0: -1150px; --r0: -7deg;
  --xm:  12vw; --ym: -3vh; --zm:  -300px; --rm: -1deg;
  --x1: -30vw; --y1: 14vh; --z1:   640px; --r1:  6deg; }

/* 2023 — owal wjeżdża od dołu i wiruje. Sylwetka czyta się jak przedmiot. */
.k2023 { --d: 6.60; --t: 1.70; --w: 74vmin; --ry: 0deg;
  --x0:  18vw; --y0:115vh; --z0: -1000px; --r0:-26deg;
  --xm:   2vw; --ym:  8vh; --zm:  -280px; --rm: -6deg;
  --x1: -16vw; --y1:-46vh; --z1:   660px; --r1: 18deg; }

/* 2024 — z lewej-dołu, bardzo blisko obiektywu. Wychodzi w skali ~2,4×. */
.k2024 { --d: 7.45; --t: 1.45; --w: 82vmin; --ry: 30deg;
  --x0:-130vw; --y0: 40vh; --z0: -1050px; --r0: 10deg;
  --xm: -14vw; --ym:  4vh; --zm:  -260px; --rm:  2deg;
  --x1:  34vw; --y1:-10vh; --z1:   700px; --r1: -7deg; }

/* 2025 — najszybszy. Krążek sklejki rzucony w kamerę, granica czytelności. */
.k2025 { --d: 8.20; --t: 1.20; --w: 72vmin; --ry: 0deg;
  --x0: 120vw; --y0:-60vh; --z0:  -950px; --r0:-34deg;
  --xm:   6vw; --ym: -4vh; --zm:  -220px; --rm:  0deg;
  --x1: -22vw; --y1: 34vh; --z1:   740px; --r1: 44deg; }

/* ─────────── finał 2026 ─────────── */

.k2026 {
  --w: 78vmin;
  animation-name: final;
  animation-duration: calc(1.6s * var(--tempo));
  animation-delay: calc(9.8s * var(--tempo));
  animation-timing-function: cubic-bezier(.13,.75,.16,1); /* 60% drogi w pierwsze
                                                             0,5 s, reszta wolno */
}
/* Cień statyczny, na <img> — rasteryzuje się raz i jedzie z transformem. */
.k2026 img { filter: drop-shadow(0 2.2vmin 3vmin rgba(0,0,0,.62)); }

@keyframes final {
  0%   { transform: translate3d(-50%, -50%, -2600px) rotate(-5deg); opacity: 0; }
  12%  { opacity: 1; }
  100% { transform: translate3d(-50%, -50%, 0) rotate(0deg); opacity: 1; }
}

/* Po wyhamowaniu: 1,5 s bezruchu. Jedyny ruch to ledwo widoczny oddech. */
.k2026.stoi {
  animation-name: oddech;
  animation-duration: calc(3s * var(--tempo));
  animation-delay: 0s;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
@keyframes oddech {
  0%, 100% { transform: translate3d(-50%, -50%, 0) scale(1); }
  50%      { transform: translate3d(-50%, -50%, 0) scale(1.015); }
}

/* ─────────── podpis pod finałem ─────────── */

#podpis {
  position: absolute;
  left: 50%;
  bottom: 13vh;
  transform: translateX(-50%) translateY(1.4rem);
  width: min(88vw, 40rem);
  text-align: center;
  font-size: clamp(.82rem, 3.1vw, 1.05rem);
  line-height: 1.5;
  letter-spacing: .05em;
  color: rgba(241,227,200,.94);   /* czytane w parku, w słońcu — nie oszczędzamy na kontraście */
  opacity: 0;
  transition: opacity .6s ease, transform .6s ease;
  pointer-events: none;
  text-shadow: 0 .2rem 1.2rem rgba(0,0,0,.8);
}
#podpis.widac { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─────────── sterowanie ─────────── */

#pomin {
  position: absolute;
  top: max(1rem, env(safe-area-inset-top));
  right: max(1rem, env(safe-area-inset-right));
  z-index: 3;
  appearance: none;
  border: 1px solid rgba(241,227,200,.4);
  background: rgba(10,8,7,.55);
  color: var(--kremowe);
  font: inherit;
  font-size: .88rem;
  letter-spacing: .04em;
  padding: .7rem 1.1rem;
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  min-height: 44px;              /* cel dotykowy dla ręki w parku */
}
#pomin:hover  { background: rgba(241,227,200,.16); }
#pomin:focus-visible { outline: 3px solid var(--kremowe); outline-offset: 3px; }

#pasek {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 2px;
  background: rgba(241,227,200,.5);
  transform-origin: 0 50%;
  transform: scaleX(0);
  animation: pasek calc(13.4s * var(--tempo)) linear both;
  animation-play-state: paused;
  opacity: .45;
}
@keyframes pasek { to { transform: scaleX(1); } }

/* Animacje ruszają dopiero, gdy JS doda .gra — czyli po wczytaniu
   dwóch pierwszych grafik albo po 2,5 s, co przyjdzie pierwsze. */
#intro.gra .karta,
#intro.gra #poswiata,
#intro.gra #pasek { animation-play-state: running; }

/* ─────────── panel oceny rytmu ───────────
   Schowany, dopóki w adresie nie ma ?rytm. Organizatorzy dostają czystą
   stronę, Piotr dokleja parametr i ma stoper z tempem. Do docelowej
   strony i tak nie wchodzi. */

#panel[hidden] { display: none; }
#panel {
  position: absolute;
  left: 50%;
  bottom: max(.6rem, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 3;
  display: flex;
  gap: .4rem;
  align-items: center;
  font-size: .78rem;
  opacity: .8;
}
#panel button {
  appearance: none;
  border: 1px solid rgba(241,227,200,.28);
  background: rgba(10,8,7,.5);
  color: var(--kremowe);
  font: inherit;
  padding: .55rem .8rem;
  border-radius: 999px;
  cursor: pointer;
  min-height: 40px;
}
#panel button[aria-pressed="true"] { background: rgba(241,227,200,.22); border-color: rgba(241,227,200,.55); }
#panel .zegar { font-variant-numeric: tabular-nums; opacity: .55; padding-left: .4rem; min-width: 3.2rem; }

/* ─────────── ograniczony ruch ─────────── */

@media (prefers-reduced-motion: reduce) {
  #intro { transition: opacity .3s ease; }
  .karta, #poswiata, #pasek { animation: none !important; }
  #pasek { display: none; }
  .karta:not(.k2026) { opacity: 0 !important; }
  .k2026 {
    opacity: 1 !important;
    transform: translate3d(-50%, -50%, 0) !important;
  }
  #podpis { transition: none; }
}
</style>
</head>
<body>

<!-- Karta pod intrem. Ładuje się równolegle, intro jej nie blokuje. -->
<div id="pod-spodem">
  <h1>IX Święto Chełmińskiego Przedmieścia</h1>
  <p class="kiedy">13 września 2026 · park przy Toruńskich Wodociągach</p>
  <div class="guziki">
    <a class="glowny" href="index.html?swieto=chelminskie">Zobacz mapę terenu</a>
    <button type="button" class="drugi" id="znowu">Obejrzyj intro jeszcze raz</button>
  </div>
</div>

<div id="intro">
  <div id="poswiata"></div>

  <div class="scena">
    <div class="karta papier      k2018"><img src="img/magnesy/2018.webp" alt="Magnes z I Święta Chełmińskiego Przedmieścia, 2018" fetchpriority="high" decoding="async"></div>
    <div class="karta papier      k2019"><img src="img/magnesy/2019.webp" alt="Magnes z II Święta, 2019" fetchpriority="high" decoding="async"></div>
    <div class="karta papier drugi-plan k2020"><img src="img/magnesy/2020.webp" alt="Magnes z III Święta, 2020" decoding="async"></div>
    <div class="karta papier      k2021"><img src="img/magnesy/2021.webp" alt="Magnes z IV Święta, 2021" decoding="async"></div>
    <div class="karta papier      k2022"><img src="img/magnesy/2022.webp" alt="Magnes z V Święta, 2022" decoding="async"></div>
    <div class="karta sylwetka    k2023"><img src="img/magnesy/2023.webp" alt="Magnes z VI Święta, 2023" decoding="async"></div>
    <div class="karta papier      k2024"><img src="img/magnesy/2024.webp" alt="Magnes z VII Święta, 2024" decoding="async"></div>
    <div class="karta sylwetka    k2025"><img src="img/magnesy/2025.webp" alt="Magnes z VIII Święta, 2025" decoding="async"></div>
    <div class="karta sylwetka    k2026" id="final"><img src="img/magnesy/2026.webp" alt="Magnes z IX Święta Chełmińskiego Przedmieścia, 2026" decoding="async"></div>
  </div>

  <p id="podpis">13 września 2026 · park przy Toruńskich Wodociągach</p>

  <button type="button" id="pomin">Pomiń intro</button>
  <div id="pasek"></div>

  <!-- Widoczne tylko przy ?rytm — patrz komentarz przy #panel w stylach. -->
  <div id="panel" hidden>
    <button type="button" class="tempo" data-tempo="1"   aria-pressed="true">1×</button>
    <button type="button" class="tempo" data-tempo="1.3" aria-pressed="false">wolniej</button>
    <span class="zegar" id="zegar">0,0 s</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  var intro   = document.getElementById('intro');
  var final   = document.getElementById('final');
  var podpis  = document.getElementById('podpis');
  var zegar   = document.getElementById('zegar');

  /* Punkty na osi czasu, w sekundach przy tempie 1×.
     PODPIS    — data wchodzi jeszcze w trakcie hamowania, żeby dało się ją
                 przeczytać: pauza trwa 1,5 s, a sam fade zjada 0,6 s.
     LADOWANIE — finał dojechał na środek i staje.
     WYJSCIE   — start wygaszenia do mapy. */
  var PODPIS    = 10.9;
  var LADOWANIE = 11.4;
  var WYJSCIE   = 12.9;
  var WYGASZANIE = 0.5;

  var malyRuch = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Stoper i tempo tylko dla oceny rytmu: intro.html?rytm
     Bez parametru pętla rAF w ogóle nie startuje — nie ma po co liczyć
     klatek dokładnie wtedy, gdy zależy nam na klatkach. */
  var rytm = /[?&]rytm\b/.test(location.search);
  if (rytm) document.getElementById('panel').hidden = false;

  var timery = [];
  var start = 0;
  var klatka = 0;

  function tempo() {
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tempo')) || 1;
  }

  function posprzataj() {
    timery.forEach(clearTimeout);
    timery = [];
    cancelAnimationFrame(klatka);
  }

  function zaplanuj(fn, sekundy) {
    timery.push(setTimeout(fn, sekundy * 1000));
  }

  function tykaj() {
    if (start) zegar.textContent = ((performance.now() - start) / 1000).toFixed(1).replace('.', ',') + ' s';
    klatka = requestAnimationFrame(tykaj);
  }

  function zakoncz() {
    posprzataj();
    intro.classList.add('znika');
    setTimeout(function () { intro.hidden = true; }, WYGASZANIE * 1000);
  }

  function graj() {
    posprzataj();
    intro.hidden = false;
    intro.classList.remove('znika', 'gra');
    final.classList.remove('stoi');
    podpis.classList.remove('widac');

    /* Wymuszenie reflow, żeby ponowne dodanie .gra naprawdę restartowało
       animacje, a nie było uznane za brak zmiany. */
    void intro.offsetWidth;

    if (malyRuch) {
      podpis.classList.add('widac');
      zaplanuj(zakoncz, 1.2);
      return;
    }

    var t = tempo();
    if (rytm) { start = performance.now(); tykaj(); }

    intro.classList.add('gra');
    zaplanuj(function () { podpis.classList.add('widac'); }, PODPIS * t);
    zaplanuj(function () { final.classList.add('stoi'); }, LADOWANIE * t);
    zaplanuj(zakoncz, WYJSCIE * t);
  }

  /* Start: czekamy na dwie pierwsze grafiki, ale nie dłużej niż 2,5 s.
     Reszta dociąga się w tle — pierwsza z nich jest potrzebna dopiero
     w 3,4 sekundzie. */
  function gdyGotowe(zrodla, limit, dalej) {
    var zrobione = false;
    function ruszaj() { if (!zrobione) { zrobione = true; dalej(); } }
    setTimeout(ruszaj, limit);
    Promise.all(zrodla.map(function (src) {
      var i = new Image();
      i.src = src;
      return i.decode ? i.decode().catch(function () {}) : Promise.resolve();
    })).then(ruszaj);
  }

  document.getElementById('pomin').addEventListener('click', zakoncz);
  document.getElementById('znowu').addEventListener('click', graj);

  Array.prototype.forEach.call(document.querySelectorAll('#panel .tempo'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('#panel .tempo'), function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      document.documentElement.style.setProperty('--tempo', b.dataset.tempo);
      graj();
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !intro.hidden) zakoncz();
  });

  gdyGotowe(['img/magnesy/2018.webp', 'img/magnesy/2019.webp'], 2500, graj);
})();
</script>
</body>
</html>
